name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Replace App Icons Safe
      run: |
        # Remove adaptive XML overrides safely if present
        rm -f app_pojavlauncher/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || true
        rm -f app_pojavlauncher/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml || true

        # Source image path
        SRC_IMG="app_pojavlauncher/src/main/res/mipmap-hdpi/ic_launcher.png"

        # Copy Moon logo safely to launcher files
        if [ -f "$SRC_IMG" ]; then
          find app_pojavlauncher/src/main/res/ -type d -name "mipmap-*" | while read -r dir; do
            cp "$SRC_IMG" "$dir/ic_launcher.png" || true
            cp "$SRC_IMG" "$dir/ic_launcher_round.png" || true
            cp "$SRC_IMG" "$dir/ic_launcher_foreground.png" || true
          done
        fi

    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MoonLauncher-APK
        path: app_pojavlauncher/build/outputs/apk/debug/*.apk
