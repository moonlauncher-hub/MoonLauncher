Name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Replace App Icons & Remove XML Overrides
      run: |
        # Remove adaptive icon XML files so Android uses PNG images directly
        rm -f app_pojavlauncher/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        rm -f app_pojavlauncher/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

        # Copy Moon Logo across all mipmap density folders
        for dir in app_pojavlauncher/src/main/res/mipmap-*; do
          if [ -d "$dir" ]; then
            cp app_pojavlauncher/src/main/res/mipmap-hdpi/ic_launcher.png "$dir/ic_launcher.png"
            cp app_pojavlauncher/src/main/res/mipmap-hdpi/ic_launcher.png "$dir/ic_launcher_round.png"
            cp app_pojavlauncher/src/main/res/mipmap-hdpi/ic_launcher.png "$dir/ic_launcher_foreground.png"
          fi
        done

    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MoonLauncher-APK
        path: app_pojavlauncher/build/outputs/apk/debug/*.apk

